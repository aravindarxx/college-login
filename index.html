        <div class="card-kicker"><span>Campus access</span><span class="secure">Secure login</span></div>
        <h2>Welcome back.</h2>
        <p class="sub">Sign in to continue to your college portal.</p>

        <div class="user-type" role="tablist" aria-label="Choose account type">
          <button class="active" type="button" role="tab" aria-selected="true" onclick="selectUser('Student', this)">Student</button>
          <button type="button" role="tab" aria-selected="false" onclick="selectUser('Faculty', this)">Faculty</button>
          <button type="button" role="tab" aria-selected="false" onclick="selectUser('Admin', this)">Admin</button>
        </div>

        <form onsubmit="login(event)">
          <div class="field">
            <label id="userLabel" for="username">Register Number</label>
            <span class="field-icon" aria-hidden="true">◈</span>
            <input id="username" type="text" placeholder="Enter Register Number" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <span class="field-icon" aria-hidden="true">◉</span>
            <input id="password" type="password" placeholder="Enter Password" autocomplete="current-password" required />
            <button class="toggle-password" type="button" aria-label="Show password" onclick="togglePassword(this)">◌</button>
          </div>

          <div class="options">
            <label class="remember"><input type="checkbox" /> <span>Remember me</span></label>
            <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
          </div>
          <button class="login-btn" type="submit">ENTER PORTAL <span aria-hidden="true">→</span></button>
        </form>

        <div class="divider"><span>OR CONTINUE WITH</span></div>
        <button class="google-btn" type="button" onclick="googleLogin()"><span class="google-g">G</span> Google Workspace</button>
        <p class="register">New to the portal? <a href="#" onclick="registerUser(event)">Create account</a></p>
        <p id="message" role="status" aria-live="polite"></p>
        <p class="footer-note">By continuing, you agree to the college portal terms<br />and acknowledge the privacy notice.</p>
      </div>
    </section>
  </main>

  <script>
    let selectedUser = 'Student';

    function selectUser(user, button) {
      selectedUser = user;
      document.querySelectorAll('.user-type button').forEach((btn) => {
        const active = btn === button;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active);
      });
      const label = document.getElementById('userLabel');
      const username = document.getElementById('username');
      const copy = {
        Student: ['Register Number', 'Enter Register Number'],
        Faculty: ['Faculty ID', 'Enter Faculty ID'],
        Admin: ['Admin ID', 'Enter Admin ID']
      }[user];
      label.textContent = copy[0];
      username.placeholder = copy[1];
      username.focus();
      document.getElementById('message').textContent = '';
    }

    function login(event) {
      event.preventDefault();
      const message = document.getElementById('message');
      message.style.color = 'var(--success)';
      message.textContent = selectedUser + ' login successful · Welcome to APEC.';
    }

    function togglePassword(button) {
      const password = document.getElementById('password');
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      button.textContent = visible ? '◌' : '◉';
      button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    }

    function googleLogin() {
      const message = document.getElementById('message');
      message.style.color = '#ffd166';
      message.textContent = 'Google Workspace authentication is ready to connect.';
    }

    function registerUser(event) {
      event.preventDefault();
      const message = document.getElementById('message');
      message.style.color = '#86d9ff';
      message.textContent = 'Registration will open in a new portal flow.';
    }

    function forgotPassword(event) {
      event.preventDefault();
      const message = document.getElementById('message');
      message.style.color = '#86d9ff';
      message.textContent = 'Password reset instructions will be sent to your college email.';
    }
  </script>
</body>
</html>
