<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC College Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0b3d91, #1976d2);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main Card */
.container {
    width: 900px;
    min-height: 550px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

/* Left Section */
.left {
    width: 50%;
    background: linear-gradient(
        rgba(0,55,120,0.85),
        rgba(0,55,120,0.85)
    ),
    url("https://images.unsplash.com/photo-1564981797816-1043664bf78d?auto=format&fit=crop&w=1000&q=80");

    background-size: cover;
    background-position: center;

    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin-bottom: 20px;
}

.left h1 {
    font-size: 35px;
    margin-bottom: 15px;
}

.left p {
    font-size: 18px;
    line-height: 1.6;
}

/* Right Section */
.right {
    width: 50%;
    padding: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 100%;
    max-width: 350px;
}

.login-box h2 {
    color: #123b70;
    font-size: 30px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

/* User Type */
.user-type {
    display: flex;
    background: #f1f4f8;
    padding: 5px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.user-type button {
    width: 33.33%;
    padding: 10px 5px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 7px;
}

.user-type button.active {
    background: #1769d1;
    color: white;
}

/* Form */
label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 18px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #1769d1;
}

/* Options */
.options {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 20px;
}

.options label {
    font-weight: normal;
}

.options input {
    margin-right: 5px;
}

a {
    color: #1769d1;
    text-decoration: none;
}

/* Login Button */
.login-btn {
    width: 100%;
    padding: 14px;
    background: #1769d1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #0d56b3;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    margin: 25px 0;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #ddd;
    flex: 1;
}

.divider span {
    margin: 0 10px;
    color: #888;
}

/* Google Button */
.google-btn {
    width: 100%;
    padding: 13px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.google-btn:hover {
    background: #f5f5f5;
}

.register {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

/* Mobile */
@media(max-width: 700px) {

    .container {
        width: 95%;
        flex-direction: column;
    }

    .left,
    .right {
        width: 100%;
    }

    .left {
        min-height: 250px;
        padding: 25px;
    }

    .left h1 {
        font-size: 28px;
    }

    .right {
        padding: 35px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left">

        <div class="logo">
            <img src="college-logo.png" alt="College Logo">
        </div>

        <h1>ABC COLLEGE</h1>

        <p>
            Empowering students through
            knowledge, innovation and excellence.
        </p>

        <br>

        <p>
            <b>Learn • Innovate • Succeed</b>
        </p>

    </div>


    <!-- RIGHT SIDE -->
    <div class="right">

        <div class="login-box">

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to your college portal
            </p>


            <!-- User Type -->
            <div class="user-type">

                <button
                    class="active"
                    onclick="selectUser('Student', this)">
                    Student
                </button>

                <button
                    onclick="selectUser('Faculty', this)">
                    Faculty
                </button>

                <button
                    onclick="selectUser('Admin', this)">
                    Admin
                </button>

            </div>


            <!-- Login Form -->
            <form onsubmit="login(event)">

                <label id="userLabel">
                    Register Number
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Register Number"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">
                    LOGIN
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <button
                class="google-btn"
                onclick="googleLogin()">
                🌐 Continue with Google
            </button>


            <p class="register">
                Don't have an account?
                <a href="#" onclick="registerUser()">
                    Create Account
                </a>
            </p>


            <p id="message"></p>

        </div>

    </div>

</div>


<script>

let selectedUser = "Student";


/* Select Student / Faculty / Admin */
function selectUser(user, button) {

    selectedUser = user;

    document
        .querySelectorAll(".user-type button")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");


    const label =
        document.getElementById("userLabel");

    const username =
        document.getElementById("username");


    if (user === "Student") {

        label.innerText = "Register Number";

        username.placeholder =
            "Enter Register Number";

    }

    else if (user === "Faculty") {

        label.innerText = "Faculty ID";

        username.placeholder =
            "Enter Faculty ID";

    }

    else {

        label.innerText = "Admin ID";

        username.placeholder =
            "Enter Admin ID";
    }
}


/* Login */
function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if (username && password) {

        message.style.color = "green";

        message.innerText =
            selectedUser + " login successful!";

    }

}


/* Google Button */
function googleLogin() {

    alert(
        "Google login will be connected to your Google authentication system."
    );

}


/* Register */
function registerUser() {

    alert(
        "Registration page will open here."
    );

}

</script>

</body>
</html>
